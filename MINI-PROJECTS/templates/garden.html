{% extends "base.html" %}

{% block scriptblock %}
<script src="{{ url_for('static', filename='js/garden.js') }}" defer></script>
{% endblock %}

{% block content %}
<section class="plantCollect">
    <div class="feelingContainer">
        <!--form done using more current tags... -->
        <form id="plantFeeling">

            <h1> Plant Your Feeling</h1>
            <h2>Every feeling deserves a place to grow.</h2>

            <div class="feelingSelect">

                <fieldset>
                    <legend>How are you feeling today?</legend>

                    <div class="feelingOption">
                        <input type="radio" id="happy" name="feeling" value="happy">
                        <label for="happy">😊 Happy</label>
                    </div>
                    <div class="feelingOption">
                        <input type="radio" id="sad" name="feeling" value="sad">
                        <label for="sad">😢 Sad</label>
                    </div>
                    <div class="feelingOption">
                        <input type="radio" id="anxious" name="feeling" value="anxious">
                        <label for="anxious">😰 Anxious</label>
                    </div>
                    <div class="feelingOption">
                        <input type="radio" id="calm" name="feeling" value="calm">
                        <label for="calm">😌 calm</label>
                    </div>
                    <div class="feelingOption">
                        <input type="radio" id="angry" name="feeling" value="angry">
                        <label for="angry">😠 Angry</label>
                    </div>

                    <div class="feelingOption">
                        <input type="radio" id="hopeful" name="feeling" value="hopeful">
                        <label for="hopeful">🌱 hopeful</label>
                    </div>
                </fieldset>
            </div>

            <div class="feelingRange">

                <div class="rangeTitle">
                    <label for="feelingStrength">How strong is this feeling?</label>
                    <span id="strengthValue">0</span>
                </div>

                <div>
                    <input type="range" id="feelingStrength" name="feelingStrength" min="0" max="10" value="0"
                        step="1" />
                </div>

                <div class="rangeLabels">
                    <span>Very weak</span>
                    <span>Very strong</span>
                </div>
            </div>

            <div class="feelingNote">
                <label for="feelingNote">Would you like to leave a note?</label>
                <textarea id="feelingNote" rows="4" cols="50" name="feelingNote"></textarea>
            </div>

            <div>
                <input id="submitFeeling" type="submit" value="🌱Plant My Feeling" />
            </div>
        </form>

    </div>
</section>
{% endblock %}
