{% extends "base.html" %}

{% block content %}
<h1>Hi, {{ user.username }}!</h1>

<section class="flex-intro">

    <div class="items">
        {# 把key从value里拿出来#}
        {% for item in passedDictionary %}
        <p>
            The key is:
            <span class="dict_key">{{ item }}</span>
            and the value is:
            <span class="dict_value">
                {{ passedDictionary[item] }}
            </span>
        </p>
        {% endfor %}
    </div>

    <div class="img_div">
        <img src="{{ imgPath }}" alt="Pineapple">
    </div>

</section>
{% endblock %}
